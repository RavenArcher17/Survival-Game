; GenericTracker, mounted at /MetaHuman: a capture tool) and the path tracer's denoiser. Both land in every cook.
+DirectoriesToNeverCook=(Path="/MetaHuman/GenericTracker")
+DirectoriesToNeverCook=(Path="/NNEDenoiser")
; MetaHuman's core library (plugin MetaHumanCoreTech, so mounted at /MetaHumanCoreTech) carries the capture tool's face detector (23 MB) the game never loads either (wild-f35).
+DirectoriesToNeverCook=(Path="/MetaHumanCoreTech/GenericTracker")
; Every shipped file under 64 MB (Freedom35's file store takes up to 64 MB a file, and installed copies update file by
; file): the cooked content is cut into 60 MB IoStore partitions (Wildreach-Windows.ucas, _s1.ucas, ...), read by the
; packaging step as -maxPartitionSize (CopyBuildToStagingDirectory.Automation.cs). Not under the biggest single chunk (UnrealPak stops: "Chunk is too large"): a MetaHuman hair, 51.6 MB.
MaxIoStorePartitionSizeMB=60
