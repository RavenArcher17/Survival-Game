[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Wildreach
Description=Multiplayer open-world survival (working title)
; The game's version: shown in the menu, compared with the newest release by the updater (Freedom35's on a Freedom35
; install), and part of the network version, so a client only joins a host on the same one. Bump it for every release.
