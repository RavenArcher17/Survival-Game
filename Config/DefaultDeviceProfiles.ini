; The project's texture cap, 2K (as the art pipeline imports everything: Tools/art, the Electric Dreams forest kit, the
; heroes), held for the packs bought on Fab too: several of their textures are 4K (the MW landscape normals, SimpleRocks,
; LavaMat, the Barghest and Mountain Dragon), 22 MB each in the package. Cooking for Windows leaves out every mip above a
; group's MaxLODSize (TextureDerivedData.cpp, the cooking target's LOD settings), so the packs' own assets stay as Fab
; ships them and the package carries them at 2K (wild-f35, 2026-11-16). Each entry is the engine's own default
; (BaseDeviceProfiles.ini, GlobalDefaults) with only MaxLODSize changed. UI, terrain height/weight maps, lightmaps and data
; textures keep the engine's limits.
[Windows DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
