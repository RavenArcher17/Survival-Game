[/Script/Engine.Engine]
; Full-body first person (cooks/hero.md 2.7): the eye sits on the head bone, so the near clip comes in to 5 cm
; (default 10) to keep the hands and a raised weapon from being cut.
NearClipPlane=5.0

[ConsoleVariables]
; PSO cache (cooks/cookpass-performance.md 3.5): remember the pipeline states a run had to compile on the spot and
; precompile them at the next launch behind the menu. The engine turns this on only in Shipping; our packages are
; Development builds. (The cache itself is on by default in every non-editor build; the editor binary leaves it off.)
r.ShaderPipelineCache.SaveUserCache=1

[DevOptions.Shaders]
; The cook writes stable shader keys (Metadata/PipelineCaches/*.shk) so a cache recorded from play can be expanded into
; Build/Windows/PipelineCaches (Tools/perf/pso_cache.ps1, Docs/PERFORMANCE.md).
NeedsShaderStableKeys=true

[/Script/OnlineSubsystemUtils.IpNetDriver]
; 100 players on a dedicated server (cooks/build-wild-100players.md 3.4): a 30 Hz server tick (Fortnite's, the engine's
; default, written here so it isn't changed by accident) and each client capped at 100 KB/s. The Replication Graph is
; chosen in code (WRNet::InstallGraphFactory, tuning net.graph.mode), not with ReplicationDriverClassName here, so a
; listen server keeps the engine's own replication.
NetServerMaxTickRate=30
MaxClientRate=100000
MaxInternetClientRate=100000
